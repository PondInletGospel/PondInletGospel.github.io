  <div class="lightbox" id="lightbox" hidden aria-hidden="true">
    <div class="lightbox-inner" role="dialog" aria-modal="true" aria-label="Image viewer">
      <div class="lightbox-top">
        <div class="lb-meta" id="lbMeta"></div>
        <div style="display:flex; gap:10px; align-items:center;">
          <a class="lb-link" id="lbOpen" href="#" target="_blank" rel="noopener">Open</a>
          <button class="lb-btn" id="lbClose" type="button">Close</button>
        </div>

    </div>

<script>
  (function(){
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbMeta = document.getElementById('lbMeta');
    const lbClose = document.getElementById('lbClose');
    const lbOpen = document.getElementById('lbOpen');
    const links = Array.from(document.querySelectorAll('#gallery a.glink'));

    let returnFocus = null;

    function getFocusableElements(){
      return Array.from(
        lightbox.querySelectorAll(
          'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'
        )
      ).filter(el => !el.hidden);
    }

    function openLB(href, name, dim){
      returnFocus = document.activeElement;

      lbImg.src = href;
      lbImg.alt = name || 'Image';
      lbMeta.textContent = (name ? name : '') + (dim ? (' • ' + dim) : '');
      lbOpen.href = href;

      lightbox.hidden = false;
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';

      lbClose.focus();
    }

    function closeLB(){
      if (lightbox.hidden) return;

      lightbox.hidden = true;
      lightbox.setAttribute('aria-hidden', 'true');
      lbImg.src = '';
      document.body.style.overflow = '';

      if (
        returnFocus &&
        typeof returnFocus.focus === 'function' &&
        document.contains(returnFocus)
      ){
        returnFocus.focus();
      }

      returnFocus = null;
    }

    links.forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        openLB(
          a.getAttribute('data-full') || a.href,
          a.dataset.name,
          a.dataset.dim
        );
      });
    });

    lbClose.addEventListener('click', closeLB);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLB();
    });

    document.addEventListener('keydown', (e) => {
      if (lightbox.hidden) return;

      if (e.key === 'Escape'){
        e.preventDefault();
        closeLB();
        return;
      }

      if (e.key === 'Tab'){
        const focusable = getFocusableElements();

        if (!focusable.length){
          e.preventDefault();
          lbClose.focus();
          return;
        }

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (!lightbox.contains(document.activeElement)){
          e.preventDefault();
          first.focus();
          return;
        }

        if (e.shiftKey && document.activeElement === first){
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last){
          e.preventDefault();
          first.focus();
        }
      }
    });
  })();
</script>
